{{ define "main" }}
<div class="shell">
  <h1 class="page-title mono">~/tags</h1>
  <ul class="tag-cloud mono">
    {{ range .Data.Terms.ByCount }}
      <li>
        <a href="{{ .Page.RelPermalink }}">#{{ .Page.Title }}</a>
        <span class="muted">({{ .Count }})</span>
      </li>
    {{ end }}
  </ul>
</div>
{{ end }}
